<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Enabled Load Management System</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0d0d0d;
  color: #fff;
}

header {
  display: flex;
  justify-content: space-between;
  padding: 15px;
  background: #111;
}

h1 {
  font-size: 16px;
  margin: 0;
}

.active { color: #00ff9c; }
.amber { color: #ffb300; }
.red { color: #ff3b3b; }

.container {
  display: flex;
  flex-wrap: wrap;
  padding: 15px;
}

.left, .right {
  flex: 1;
  min-width: 300px;
  padding: 10px;
}

.card {
  background: #161616;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #333;
}

.relay-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.toggle {
  margin-top: 10px;
  padding: 8px;
  border: none;
  width: 100%;
  border-radius: 5px;
}

.on { background: #00ff9c; color: #000; }
.off { background: #ffb300; color: #000; }

.battery-bar {
  width: 100%;
  height: 20px;
  background: #222;
  border-radius: 10px;
  overflow: hidden;
}

.battery-fill {
  height: 100%;
  width: 0%;
}

.bottom {
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>IoT Enabled Load Management System</h1>
  <div>
    <span class="active">System Active</span> |
    <span id="gridStatus">Grid Active</span>
  </div>
</header>

<div class="container">

  <!-- LEFT -->
  <div class="left">
    <div class="card">

      <div>Battery</div>
      <div id="soc" style="font-size:28px;">0%</div>

      <div class="battery-bar">
        <div id="batteryFill" class="battery-fill"></div>
      </div>

      <div id="voltage">0V</div>

      <div style="margin-top:15px;">
        Current: <span id="current">0A</span>
      </div>

    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="relay-grid" id="relayGrid"></div>
  </div>

</div>

<div class="bottom">
  <canvas id="chart"></canvas>
</div>

<script>
const relayNames = ["A/C", "TV", "Lighting", "Water Pump"];

let voltage = 24.5;
let grid = true;
let relays = [true, true, true, true];

const ctx = document.getElementById("chart").getContext("2d");

let chart = new Chart(ctx, {
  type: "line",
  data: {
    labels: [],
    datasets: [{
      label: "Current (A)",
      data: [],
      borderColor: "#00ff9c",
      tension: 0.3
    }]
  },
  options: {
    scales: {
      x: { ticks: { color: "#fff" } },
      y: { ticks: { color: "#fff" } }
    },
    plugins: {
      legend: { labels: { color: "#fff" } }
    }
  }
});

function simulateData() {

  // fixed battery baseline at 70%
  voltage = 22.5;

  let soc = 70;

  // Grid behavior still active
  if (Math.random() < 0.02) grid = !grid;

  // Load prioritization stays the same
  if (soc >= 70) {
    relays = [true, true, true, true];
  } else if (soc >= 50) {
    relays = [false, true, true, true];
  } else if (soc >= 25) {
    relays = [false, false, true, true];
  } else {
    relays = [false, false, true, false];
  }

  relays[2] = true; // lighting always ON

  let baseLoads = [350, 800, 50, 5000.0];

  let current = 0;
  relays.forEach((state, i) => {
    if (state) current += baseLoads[i] + Math.random() * 0.2;
  });

  return {
    grid,
    voltage: voltage.toFixed(2),
    current: current.toFixed(2),
    relays
  };
}

function updateRelayUI(relays) {
  const gridEl = document.getElementById("relayGrid");
  gridEl.innerHTML = "";

  relays.forEach((state, i) => {
    let card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div>${relayNames[i]}</div>
      <div class="${state ? 'active' : 'amber'}">
        ${state ? 'Connected' : 'Shed'}
      </div>
      <button class="toggle ${state ? 'on' : 'off'}">
        ${state ? 'Powered' : 'Disconnected'}
      </button>
    `;

    gridEl.appendChild(card);
  });
}

function updateChart(current) {
  const time = new Date().toLocaleTimeString();

  chart.data.labels.push(time);
  chart.data.datasets[0].data.push(current);

  if (chart.data.labels.length > 30) {
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
  }

  chart.update();
}

function updateUI(data) {

  document.getElementById("gridStatus").textContent =
    data.grid ? "Grid Active" : "Battery Preservation Mode";

  let soc = Math.round((data.voltage / 25) * 100);

  document.getElementById("soc").textContent = soc + "%";
  document.getElementById("voltage").textContent = data.voltage + "V";
  document.getElementById("current").textContent = data.current + "A";

  let fill = document.getElementById("batteryFill");
  fill.style.width = soc + "%";

  if (soc > 50) fill.style.background = "#00ff9c";
  else if (soc > 25) fill.style.background = "#ffb300";
  else fill.style.background = "#ff3b3b";

  updateRelayUI(data.relays);
  updateChart(parseFloat(data.current));
}

async function fetchData() {
  try {
    const res = await fetch("/data");
    const data = await res.json();
    updateUI(data);
  } catch {
    updateUI(simulateData());
  }
}

setInterval(fetchData, 1000);
</script>

</body>
</html>
